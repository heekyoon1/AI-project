<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 메뉴 | 직장인 점심 추천</title>
  <meta name="description" content="직장인들을 위한 점심 메뉴 추천 서비스" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="오늘의 메뉴 홈">
        <span class="brand-mark">O</span>
        <span>오늘의 메뉴</span>
      </a>
      <div class="top-actions">
        <span class="date-pill"><span class="live-dot"></span> 2026. 08. 11 화요일</span>
        <button class="icon-button" id="savedBtn" aria-label="찜한 메뉴 보기">♡ <span id="savedCount">0</span></button>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">LUNCH, MADE EASY</p>
          <h1>오늘 점심,<br><span>고민은 여기까지.</span></h1>
          <p class="hero-description">3초만에 찾아줄게.</p>
          <button class="primary-button" id="randomBtn"><span class="sparkle">✦</span> 오늘의 메뉴 뽑기 <span class="arrow">↗</span></button>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="orb orb-one"></div><div class="orb orb-two"></div>
          <div class="food-card food-card-back"><span>🥗</span></div>
          <div class="food-card food-card-main"><span class="food-emoji">🍛</span><span class="card-sticker">오늘 뭐 먹지?</span></div>
          <span class="float-star star-a">✦</span><span class="float-star star-b">✧</span>
        </div>
      </section>

      <section class="menu-section">
        <div class="section-heading">
          <div><p class="eyebrow">CURATED FOR YOU</p><h2>오늘의 추천 메뉴</h2></div>
          <p class="result-label"><span id="resultCount">6</span>개의 메뉴</p>
        </div>
        <div class="toolbar">
          <div class="category-tabs" role="tablist" aria-label="메뉴 카테고리">
            <button class="tab active" data-category="전체">전체</button>
            <button class="tab" data-category="한식">한식</button>
            <button class="tab" data-category="일식">일식</button>
            <button class="tab" data-category="중식">중식</button>
            <button class="tab" data-category="가벼운 식사">가벼운 식사</button>
          </div>
          <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="메뉴 검색" /></label>
        </div>
        <div class="menu-grid" id="menuGrid"></div>
        <div class="empty-state" id="emptyState" hidden>조건에 맞는 메뉴가 없어요. 다른 메뉴를 찾아볼까요?</div>
      </section>

      <section class="tip-banner">
        <div class="tip-icon">☀</div><div><p class="eyebrow">TODAY'S TIP</p><p>오후에 중요한 일정이 있다면 <strong>가볍고 든든한 메뉴</strong>를 추천해요.</p></div>
        <span class="tip-arrow">→</span>
      </section>
    </main>
    <footer><span>© 2026 오늘의 메뉴</span><span>점심은 소중하니까요.</span></footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
